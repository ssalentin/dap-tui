[package]
name = "dap-tui"
version = "0.3.4"
edition = "2021"
description = "Device sync for portable players — TUI edition (ratatui)"
license = "MIT"

[dependencies]
ratatui = "0.30"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
unicode-normalization = "0.1"
unicode-width = "0.2"
dirs = "6"
libc = "0.2"
anyhow = "1"

[profile.release]
lto = true
opt-level = 3
strip = true
